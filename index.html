<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circularity Decision Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#FAF8F5;--panel:#FFFFFF;--panel2:#F4F1EB;--panel3:#EDE8DF;--ink:#141414;--ink2:#4B4541;--muted:#7B726D;
  --line:rgba(20,20,20,.11);--line2:rgba(20,20,20,.06);--yellow:#FFDD00;--yellow-ink:#141414;--yellow-soft:#FBF3D8;
  --ok:#17703F;--ok-soft:#E2F0E7;--warn:#8A6400;--warn-soft:#FBF0CC;--bad:#B3382C;--bad-soft:#F8E3DF;--info:#3A3E46;--info-soft:#EAE5DC;
  --side:#141414;--side-ink:#E9E3DB;--side-mut:#9C9189;--shadow:0 1px 2px rgba(20,20,20,.05),0 10px 30px rgba(20,20,20,.07);
  --f-display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;--f-body:'Inter','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --chart1:#141414;--chart2:#FFDD00;--chart3:#8A6D00;--chart4:#5E5652;--chart5:#9C8F84;--chart6:#C9B24A;--chart7:#BDAFA3;
}
:root[data-theme="dark"]{
  --bg:#111112;--panel:#1D1D20;--panel2:#26262A;--panel3:#303036;--ink:#F6F3EE;--ink2:#D3CAC0;--muted:#A0958B;
  --line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.07);--yellow-soft:rgba(255,221,0,.13);
  --ok:#62D393;--ok-soft:rgba(98,211,147,.14);--warn:#FFDD00;--warn-soft:rgba(255,221,0,.13);--bad:#FF8F80;--bad-soft:rgba(255,143,128,.14);--info:#D3CAC0;--info-soft:rgba(211,202,192,.1);
  --side:#000;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.4);--chart1:#F6F3EE;--chart3:#E0C23C;--chart4:#B9AEA3;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);font-feature-settings:'tnum' 1,'cv11' 1;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
:root[data-theme="dark"] :focus-visible{outline-color:var(--yellow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:15px;font-weight:700}h4{font-size:13px;font-weight:700}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}.right{text-align:right}.nowrap{white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 0}
.brand{padding:0 18px 18px}.brand img{width:148px;display:block}.brand small{display:block;margin-top:10px;color:var(--side-mut);font-size:12px;line-height:1.3}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:6px;text-decoration:none;color:var(--side-ink);font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;background:var(--yellow);border-radius:0 3px 3px 0}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .sub{display:block;font-size:11.5px;color:var(--side-mut);font-weight:400}
.nav .cnt{margin-left:auto;background:var(--yellow);color:#141414;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:14px 18px 0;font-size:12px;color:var(--side-mut);border-top:1px solid rgba(255,255,255,.1)}
.side-foot b{color:var(--side-ink);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 12px 0 34px}
.search svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--muted)}
.results{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:50}
.results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 12px}
.results button:hover,.results button[aria-selected=true]{background:var(--panel2)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sel{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 8px;max-width:150px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px;white-space:nowrap}
button.pill:hover{background:var(--panel2)}
.pill.demo{background:var(--yellow-soft);border-color:color-mix(in srgb,var(--yellow) 60%,transparent);font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.iconbtn:hover{background:var(--panel2)}.iconbtn svg{width:17px;height:17px}
/* journey strip */
.jstrip{display:flex;align-items:stretch;gap:0;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.jstrip .jl{font-size:12px;color:var(--muted);align-self:center;padding-right:14px;white-space:nowrap}
.jstep{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-left-width:0;font-size:12px;white-space:nowrap;color:var(--muted);background:transparent;position:relative}
.jstep:first-of-type{border-left-width:1px;border-radius:6px 0 0 6px}.jstep:last-of-type{border-radius:0 6px 6px 0}
.jstep .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted);flex:none}
.jstep.built .n{border-color:var(--line)}
.jstep.on{color:var(--ink);font-weight:600;background:var(--yellow-soft)}
.jstep.on.built .n{background:var(--yellow);border-color:var(--yellow);color:#141414}
.jstep.on.ext .n{background:var(--panel);border-color:var(--ink);color:var(--ink)}
.jstep.on.human .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.jstep.built:not(.on) .n{border-style:dashed}
.jkey{margin-left:auto;display:flex;gap:12px;align-items:center;padding-left:16px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.jkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--ink)}
.jkey .y{background:var(--yellow);border-color:var(--yellow)}.jkey .w{background:var(--panel)}.jkey .b{background:var(--ink)}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px 1px 3px;border-radius:12px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);white-space:nowrap;vertical-align:middle;cursor:help}
.stp b{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:var(--yellow);color:#141414}
.stp.ext b{background:var(--panel);border:1px solid var(--ink);color:var(--ink)}.stp.human b{background:var(--ink);color:var(--bg)}
/* page */
.page{padding:22px 24px 80px;max-width:1500px;width:100%;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.phead p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.panel>.ph h3{flex:1}.panel>.pb{padding:14px 16px}
.panel.flat{border-radius:4px}
.sect{margin-top:26px}
.sect>.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sect>.sh h2{flex:1}
.note{font-size:12.5px;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel2)}.btn svg{width:15px;height:15px}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:#141414}.btn.pri:hover{filter:brightness(.95);background:var(--yellow)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.dark:hover{background:var(--ink2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}.btn.lg{height:42px;padding:0 20px;font-size:14px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel2)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.y{background:var(--yellow);color:#141414}.chip.dk{background:var(--ink);color:var(--bg)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}.dotc.ok{background:var(--ok)}.dotc.warn{background:#D4A800}.dotc.bad{background:var(--bad)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line2);text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;position:relative}
.kpi:last-child{border-right:0}.kpi:hover{background:var(--panel2)}
.kpi[aria-pressed=true]{background:var(--yellow-soft);box-shadow:inset 0 -3px 0 var(--yellow)}
.kpi .v{font:800 28px/1.1 var(--f-display);letter-spacing:-.02em}.kpi .l{font-size:12.5px;color:var(--ink2);margin-top:2px}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.static{cursor:default}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tw[style*="max-height"] table.t th{position:sticky;top:0;z-index:2}
table.t th button{border:0;background:none;padding:0;font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover{background:var(--panel2)}
table.t tbody tr.sel{background:var(--yellow-soft)}
table.t.static tbody tr{cursor:default}
table.t td.r,table.t th.r{text-align:right}
.thumb{width:36px;height:30px;border-radius:4px;background:var(--panel2);display:grid;place-items:center;color:var(--ink2);flex:none}
.thumb svg{width:22px;height:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.filters input[type=search],.filters .sel{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 10px}
.filters input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;height:32px;padding:0 12px;font-weight:600;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* case view */
.casehead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.assetstrip{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;margin-bottom:18px;flex-wrap:wrap}
.assetstrip>div{padding:10px 16px;border-right:1px solid var(--line2);min-width:140px}.assetstrip>div:last-child{border-right:0}
.assetstrip .k{font-size:12px;color:var(--muted)}.assetstrip .v{font-weight:600;margin-top:1px}
.blk{padding:18px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:0}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.bh h2{font-size:17px}.bh .sp{flex:1}
.bn{width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#141414;display:grid;place-items:center;font:800 13px var(--f-display);flex:none}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.ev{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);align-items:start}
.ev .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--ok);color:#fff;margin-top:1px}
.ev.missing .ic{background:var(--bad)}.ev.partial .ic,.ev.stale .ic{background:#D4A800;color:#141414}.ev.conflict .ic{background:var(--bad)}
.ev b{font-weight:600;display:block;font-size:13px}.ev small{color:var(--muted);font-size:12px;display:block}
.ev em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.best{border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:18px;position:sticky;top:132px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .best{border-color:var(--yellow)}
.best .big{font:800 46px/1 var(--f-display);letter-spacing:-.03em;margin:6px 0 2px}
.best .act{font:700 19px/1.25 var(--f-display)}
.best .why{font-size:13px;color:var(--ink2);margin:8px 0 12px}
.best .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px;margin:12px 0;padding:10px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.best .meta span{color:var(--muted);display:block}
.best.blocked{border-color:var(--bad)}
.best.hold-b{border-style:dashed}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.chain b{color:var(--ink);font-weight:600}
.stagebar{display:flex;gap:0;margin:8px 0}
.stg{flex:1;padding:8px 8px 8px 10px;font-size:12px;border-top:3px solid var(--line);color:var(--muted)}
.stg.done{border-color:var(--ok);color:var(--ink)}.stg.active{border-color:var(--yellow);color:var(--ink);font-weight:600;background:var(--yellow-soft)}
.stg small{display:block;color:var(--muted);font-weight:400}
.gates{display:flex;gap:3px}.gate{width:14px;height:14px;border-radius:3px;background:var(--ok)}.gate.fail{background:var(--bad)}.gate.skip{background:var(--panel3)}.gate.warn{background:#D4A800}
.gstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.gcell{border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:12px}
.gcell b{display:flex;gap:6px;align-items:center;font-size:12px}.gcell p{margin:4px 0 0;color:var(--muted);font-size:11.5px;line-height:1.35}
.gcell.pass{border-top:3px solid var(--ok)}.gcell.fail{border-top:3px solid var(--bad);background:var(--bad-soft)}.gcell.skip{border-top:3px solid var(--panel3);opacity:.7}
.exp{background:var(--panel2);padding:14px 16px}
.bar{height:8px;border-radius:4px;background:var(--panel3);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ink)}
:root[data-theme="dark"] .bar>i{background:var(--yellow)}
.range{position:relative;height:18px;min-width:130px}
.range .tr{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--panel3)}
.range .bd{position:absolute;top:5px;height:8px;background:var(--yellow);border:1px solid rgba(0,0,0,.35);border-radius:2px}
.range .md{position:absolute;top:2px;width:2px;height:14px;background:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.terms{width:100%;font-size:13px;border-collapse:collapse}.terms td{padding:5px 0;border-bottom:1px dotted var(--line)}.terms td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.terms tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;padding-top:8px}
/* sliders */
.sl{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--ink)}
:root[data-theme="dark"] input[type=range]{accent-color:var(--yellow)}
.tog{display:inline-flex;align-items:center;gap:8px}
.tog input{width:16px;height:16px;accent-color:var(--ink)}
/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.38);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);z-index:61;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.drawer .dh h2{flex:1}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:10px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .box.wide{width:min(820px,100%)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}.modal .mh h2{flex:1}
.modal .mb{padding:18px 20px}.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px}
.fld textarea{min-height:84px;resize:vertical}.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}.fld .err{font-size:12px;color:var(--bad);margin-top:4px}

<script>
/* ===== Seeded world: one generator feeds every page ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RNG=mulberry32(20261007);
const rnd=()=>RNG();
const rint=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function wpick(pairs){let r=rnd()*pairs.reduce((s,p)=>s+p[1],0);for(const p of pairs){if((r-=p[1])<=0)return p[0]}return pairs[pairs.length-1][0]}
const round=(n,s=1)=>Math.round(n/s)*s;
const AS_OF=new Date('2026-10-07T09:00:00Z');
const MONTHS=['Oct 25','Nov 25','Dec 25','Jan 26','Feb 26','Mar 26','Apr 26','May 26','Jun 26','Jul 26','Aug 26','Sep 26'];
const TENANTS=['Customer A','Customer B','Customer C'];
const SITES=[{id:'Site 1',name:'Pune Works'},{id:'Site 2',name:'Hosur Assembly'},{id:'Site 3',name:'Chennai Foundry'},{id:'Site 4',name:'Nashik Plant'},{id:'Site 5',name:'Vizag Port Yard'},{id:'Site 6',name:'Coimbatore Mill'},{id:'Site 7',name:'Surat Textiles'},{id:'Site 8',name:'Indore Packaging'}];
const FACILITIES=['Warehouse 1','Warehouse 2','Repair centre'];
const ROUTES=[
 {id:'redeploy',name:'Redeploy',short:'Redeploy',color:'#141414'},
 {id:'resale',name:'Whole-asset resale',short:'Resale',color:'#FFDD00'},
 {id:'intparts',name:'Internal recovered-part use',short:'Internal parts',color:'#8A6D00'},
 {id:'relase',name:'Re-lease',short:'Re-lease',color:'#5E5652'},
 {id:'material',name:'Material recovery',short:'Material',color:'#9C8F84'},
 {id:'extparts',name:'External parts sale',short:'External parts',color:'#C9B24A'},
 {id:'exit',name:'Responsible exit',short:'Exit',color:'#BDAFA3'}
];
const ROUTE_MIX=[['redeploy',24],['resale',22],['intparts',18],['relase',12],['material',10],['extparts',9],['exit',5]];
const MODELS=[{v:'v1.0',from:0,to:2,bias:-.09,k:1.34,released:'2025-09-22'},{v:'v1.1',from:3,to:5,bias:-.05,k:1.18,released:'2026-01-05'},{v:'v1.2',from:6,to:8,bias:-.02,k:1.13,released:'2026-04-02'},{v:'v1.3',from:9,to:11,bias:-.005,k:.95,released:'2026-07-01'}];
const GATES=['Condition & life','Post-intervention','Policy & certification','Demand fit','Economics','Sustainability'];
const CLASSES={
 motor:{label:'Industrial motor',plural:'Industrial motors',pre:'MTR',pnew:11800,tau:11,mfr:['Voltara','Kestrel Drives','Halden Electric'],weight:20},
 pump:{label:'Hydraulic pump',plural:'Hydraulic pumps',pre:'PMP',pnew:6400,tau:9,mfr:['Halden Hydraulics','Norvik Fluid','Aquaterra'],weight:18},
 control:{label:'Control unit',plural:'Control units / PLCs',pre:'CTL',pnew:4300,tau:7,mfr:['Orbis Control','Kestrel Automation','Tessen Logic'],weight:17},
 drill:{label:'Power tool',plural:'Power tools',pre:'DRL',pnew:340,tau:4.5,mfr:['Tessen Tools','Norvik Power','Brava'],weight:19},
 batch:{label:'Tool-fleet batch',plural:'Tool-fleet batches',pre:'BAT',pnew:150,tau:4,mfr:['Brava','Tessen Tools'],weight:11},
 it:{label:'IT electronics',plural:'IT electronics',pre:'ITE',pnew:820,tau:3.2,mfr:['Lumeo Devices','Corvid Computing','Nimbus'],weight:15}
};
const GRADE_F={A:1,B:.86,C:.64,D:.38};
const money=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtD=d=>{d=new Date(d);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'})};
const fmtDY=d=>{d=new Date(d);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})};
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*864e5);
const sum=a=>a.reduce((s,x)=>s+x,0);

/* ===== Live returns: 128 cases (hand-written heroes + seeded fill) ===== */
const T=(label,amt,kind)=>({label,amt,kind});
const termSum=r=>sum(r.terms.map(t=>t.amt));
const GATE_OK=['pass','pass','pass','pass','pass','pass'];
function mkRoute(o){ // normalise a route
  const r=Object.assign({gates:GATE_OK.slice(),gateNotes:[],excluded:false,failGate:-1,failReason:'',demandStatus:'confirmed',p:1,sigma:.12},o);
  r.net=termSum(r);
  const spread=Math.max(Math.abs(r.net)*r.sigma*1.28,12);
  r.p10=Math.round(r.net-spread*(r.skew||1)); r.p90=Math.round(r.net+spread*.82);
  return r;
}
function fail(r,g,reason){r.excluded=true;r.failGate=g;r.failReason=reason;r.gates[g]='fail';for(let i=g+1;i<6;i++)if(r.gates[i]==='pass')r.gates[i]='skip';return r}

const SPEC_GEN={
 motor:()=>{const kw=pick([5.5,11,15,18.5,22,30,37,45,55,75]);return{'Rated power':kw+' kW','IEC frame':pick(['132M','160M','160L','180M','200L','225M','250M']),'Efficiency class':pick(['IE2','IE3','IE3','IE4']),'Voltage':'400 V','Speed':pick(['1,450','1,480','2,950'])+' rpm'}},
 pump:()=>({'Flow':rint(12,180)+' m³/h','Head':rint(18,95)+' m','Pressure':pick([160,210,250,315])+' bar','Drive':pick(['Gear','Vane','Axial piston']),'Port':pick(['G 1"','G 1¼"','SAE 16'])}),
 control:()=>({'Family':pick(['Series 7 PLC','Edge-X controller','Drive module D4','HMI-12 panel']),'I/O points':pick([32,64,96,128]),'Firmware':'v'+rint(3,6)+'.'+rint(0,9)+'.'+rint(0,4),'Supply':'24 V DC','Safety rating':pick(['None','SIL 1','SIL 2'])}),
 drill:()=>({'Type':pick(['Hammer drill','Impact driver','Angle grinder','Rotary hammer']),'Voltage':pick(['18 V','36 V','230 V']),'Battery cycles':rint(80,620),'Chuck':pick(['13 mm','SDS-plus','M14'])}),
 batch:()=>({'Tool type':pick(['Torque drivers','Cordless drills','Impact wrenches']),'Cell chemistry':'Li-ion 18 V','Lot grade':'Mixed A–C','Calibration':'Out of date'}),
 it:()=>({'Device':pick(['Laptop 14"','Laptop 15"','Tablet 10"','Rugged tablet']),'CPU / RAM':pick(['i5 / 16 GB','i7 / 16 GB','i5 / 8 GB','ARM / 8 GB']),'Storage':pick(['256 GB','512 GB']),'Battery health':rint(52,94)+'%','Data erasure':pick(['Certified','Pending','Pending'])})
};

function evidenceFor(c){
  const base=[
   ['ret','Return record available','WMS · reverse logistics'],
   ['id','Identity and configuration verified','PLM'],
   ['insp','Inspection report available','Inspection'],
   ['svc','Service history retrieved','EAM'],
   ['eng','Engineering assessment available','Engineering'],
   ['photo','Photos available','Inspection'],
   ['dem','Demand evidence linked','CRM'],
   ['mkt','Market comparables current','Market pricing'],
   ['cost','Cost and stock data available','ERP finance'],
   ['pol','Policy & certification checked','Engineering']
  ];
  return base.map(([k,label,source])=>({k,label,source,state:'ready',fresh:pick(['12 min ago','41 min ago','2 h ago','5 h ago','yesterday']),note:''}));
}
function setEv(c,k,state,note,fresh){const e=c.evidence.find(x=>x.k===k);if(e){e.state=state;e.note=note||'';if(fresh)e.fresh=fresh}}

/* generic valuation: all seven channels, gates, exclusions */
function buildRoutes(c){
  const K=CLASSES[c.cls],g=c.grade||'C',q=c.qty;
  const mv=K.pnew*Math.exp(-c.age/K.tau)*GRADE_F[g]*q*Math.exp(gauss()*.08);
  const dem=c.demand||{};
  const R=[];
  const sale=Math.round(mv*(0.92+rnd()*.1)),fees=Math.round(sale*(.08+rnd()*.05)+(c.cls==='motor'||c.cls==='pump'?140:12*Math.sqrt(q)));
  const refAdd=Math.round(sale*(.04+rnd()*.14)),refCost=Math.round(sale*(.06+rnd()*.09));
  const asIs=mkRoute({id:'resale',plan:'Sell whole asset as-is',demandLabel:'External buyer · '+(c.cls==='it'?'refurbisher auction':'dealer network'),demandStatus:'forecast',terms:[T('Expected sale proceeds',sale,'sale'),T('Fees and freight',-fees,'fees'),T('Unsold-risk allowance',-Math.round(sale*.04),'risk')],unc:'Price, sale timing, unsold risk',why:'Direct sale; no workshop capacity used',sigma:.14});
  const asIsRef=mkRoute({id:'resale',variant:'refurb',plan:'Refurbish, then sell',demandLabel:'External buyer · higher grade',demandStatus:'forecast',terms:[T('Expected sale proceeds',sale+refAdd,'sale'),T('Refurbishment',-refCost,'prep'),T('Fees and freight',-fees,'fees'),T('Unsold and repair-failure allowance',-Math.round(sale*.07),'risk')],unc:'Repair success and resulting grade',why:'Adds value only if grade lift lands',sigma:.2});
  R.push(asIs.net>=asIsRef.net?asIs:asIsRef);
  asIs.refurbDelta=asIsRef.net-asIs.net; R[0].refurbDelta=asIsRef.net-asIs.net;
  // redeploy
  const hasDem=dem.internal;
  const avoid=Math.round(K.pnew*q*(.78+rnd()*.2));
  const prep=Math.round(K.pnew*q*(.06+rnd()*.1)),svc=Math.round(K.pnew*q*(.02+rnd()*.06)),res=Math.round(K.pnew*q*.02);
  const rd=mkRoute({id:'redeploy',plan:'Redeploy to '+(dem.site||'Site 2'),demandLabel:(dem.site||'Site 2')+' · '+(dem.confirmed?'confirmed internal need':'forecast replacement'),demandStatus:dem.confirmed?'confirmed':'forecast',terms:[T('Avoided equivalent purchase',avoid,'purchase'),T('Preparation and transfer',-prep,'prep'),T('Service exposure',-svc,'service'),T('Residual value adjustment',res,'residual')].concat(dem.confirmed?[]:[T('Non-realization allowance',-Math.round(avoid*.12),'risk')]),unc:'Cost and service forecasts',why:'Avoids purchase; fits duty and due date',sigma:.13});
  if(!hasDem)fail(rd,3,'No open internal requirement matches specification and timing');
  R.push(rd);
  // re-lease
  const li=Math.round(K.pnew*q*(.16+rnd()*.14)*GRADE_F[g]);
  const rl=mkRoute({id:'relase',plan:'Re-lease '+(dem.lease?'to '+dem.lease:'(no prospect)'),demandLabel:dem.lease?'Lease opportunity · pipeline':'No lease opportunity',demandStatus:'forecast',terms:[T('Lease income over 30 months',li,'lease'),T('Preparation',-Math.round(li*.14),'prep'),T('Operating and service costs',-Math.round(li*.2),'service'),T('Non-realization allowance',-Math.round(li*.1),'risk')],unc:'Utilisation, service and residual',why:'Keeps ownership; lower contribution over same horizon',sigma:.18});
  if(!dem.lease)fail(rl,3,'No lease opportunity within the horizon');
  R.push(rl);
  // internal parts
  const pv=Math.round(K.pnew*q*(.22+rnd()*.16)*Math.max(GRADE_F[g],.5));
  const ip=mkRoute({id:'intparts',plan:'Recover parts for internal use',demandLabel:dem.parts?'Component demand · service stock':'No component demand',demandStatus:dem.parts?'confirmed':'forecast',terms:[T('Value of parts consumed internally',pv,'parts'),T('Extraction and testing',-Math.round(pv*.2),'prep'),T('Logistics',-Math.round(pv*.07),'fees'),T('Source-asset value lost',-Math.round(mv*.12),'residual')],unc:'Recovery yield and part consumption',why:'Recovery is below whole-asset benefit',sigma:.22});
  if(!dem.parts)fail(ip,3,'No open component demand matches recoverable parts');
  R.push(ip);
  // external parts
  const ev=Math.round(K.pnew*q*(.17+rnd()*.12)*Math.max(GRADE_F[g],.5));
  const ep=mkRoute({id:'extparts',plan:'Sell parts externally',demandLabel:'Accepting external buyer',demandStatus:'forecast',terms:[T('Parts sale proceeds',ev,'parts'),T('Extraction and testing',-Math.round(ev*.16),'prep'),T('Selling and freight',-Math.round(ev*.12),'fees'),T('Unsold-risk allowance',-Math.round(ev*.06),'risk')],unc:'Buyer acceptance and qualification',why:'Below internal use on the same cost basis',sigma:.24});
  R.push(ep);
  // material recovery
  const mat=Math.round(K.pnew*q*(.03+rnd()*.025)),proc=Math.round(mat*.4+10*Math.sqrt(q));
  const mr=mkRoute({id:'material',plan:'Recover material',demandLabel:'Certified recycler · spot prices',terms:[T('Metals and recoverable materials',mat,'material'),T('Processing and logistics',-proc,'fees'),T('Disposal cost avoided',Math.round(25*Math.sqrt(q)),'avoid')],unc:'Yield and commodity price',why:'Floor value; lowest uncertainty',sigma:.2});
  R.push(mr);
  const ex=mkRoute({id:'exit',plan:'Responsible exit (approved vendor)',demandLabel:'Approved exit vendor A',terms:[T('Collection',-Math.round(20*Math.sqrt(q)),'fees'),T('Processing',-Math.round(70*Math.sqrt(q)),'fees'),T('Vendor credit',Math.round(30*Math.sqrt(q)),'credit')],unc:'Vendor fees',why:'Compliant fallback only',sigma:.08});
  R.push(ex);
  // condition & policy gates
  if(g==='D'){R.filter(r=>['redeploy','resale','relase'].includes(r.id)).forEach(r=>{if(!r.excluded)fail(r,0,'Remaining life below the minimum for the intended use')})}
  if(c.cls==='it'&&c.spec['Data erasure']==='Pending'){const r=R.find(r=>r.id==='resale');fail(r,2,'Data-erasure certificate not issued; sanitization required before release')}
  if(c.cls==='control'&&/SIL/.test(c.spec['Safety rating'])){const r=R.find(r=>r.id==='redeploy'&&!r.excluded);if(r)fail(r,2,'Safety-rated unit: criticality restriction needs recertification')}
  if(c.consentGap){const r=R.find(r=>r.id==='redeploy'&&!r.excluded);if(r)fail(r,2,'Demand belongs to another client; customer consent not on file')}
  if(c.cls==='batch'||c.cls==='it'){const r=R.find(r=>r.id==='material');if(rnd()<.12)fail(r,5,'Cell chemistry requires an approved hazardous-waste route')}
  R.forEach(r=>{if(!r.excluded&&r.id!=='exit'&&r.net<=0)fail(r,4,'Expected net contribution is not positive')});
  R.forEach(r=>{r.net=termSum(r)});
  return R;
}
function rankRoutes(c){
  const el=c.routes.filter(r=>!r.excluded).sort((a,b)=>b.net-a.net);
  el.forEach((r,i)=>r.rank=i+1);
  c.routes.filter(r=>r.excluded).forEach(r=>r.rank=null);
  c.recommendation=c.blocked?null:(el[0]||null);
}

/* ===== Hand-written hero cases (exact framework numbers) ===== */
const CASES=[];const CASE_BY_ID={};
function addCase(c){CASES.push(c);CASE_BY_ID[c.id]=c;return c}
function baseCase(o){
  const K=CLASSES[o.cls];
  const c=Object.assign({qty:1,received:new Date('2026-10-03'),location:'Warehouse 1',stage:'awaiting_approval',kind:'standard',blocked:null,hero:false,notes:[],timeline:null,exec:null,approval:null,override:null,mfr:pick(K.mfr),model:'v1.3',engLife:'—',nextInspection:'—',demand:{},predictions:null,facts:null},o);
  c.evidence=evidenceFor(c);c.product=K.label;
  return c;
}
function gnotes(r,notes){r.gateNotes=notes;return r}

  const ex=mkRoute({id:'exit',plan:'Responsible exit',demandLabel:'Approved vendor A',terms:[T('Collection',-20,'fees'),T('Processing',-70,'fees'),T('Vendor credit',30,'credit')],unc:'Vendor fees',why:'Compliant fallback only',sigma:.08});

  c.routes=[rd,sb,rl,ip,mr,ex,ep];
  c.predictions=[
   {src:'EAM + workshop + logistics',inputs:'Condition, prior repairs, queue and transfer quote',model:'prep-cost-time',ver:'v1.3',result:'$1,800 cost · ready Day 4',range:'range Day 3–7',conf:'High'},
   {src:'EAM + PLM + Site 3 duty',inputs:'Failure history, compatible specification and receiving duty',model:'service-exposure',ver:'v1.2',result:'$900 additional expected service cost',range:'over 30 months',conf:'Medium'},
   {src:'Sales records + market demand + PLM',inputs:'48 comparable sales, grade, age and current enquiries',model:'resale-price',ver:'v1.3',result:'$4,800 expected net sale recovery',range:'P10–P90 $3,900–$5,600',conf:'High'}];
  c.facts=['ERP: planned purchase $12,000','Planning/WMS: Site 3 need in 10 days; RT-1062 needed at Site 5','Baseline: buy a new motor for Site 3'];
  c.timing='Day 3–7 vs Day 10 deadline';c.horizon='30-month horizon';
  c.pool={supplies:[{id:'RT-1048',label:'RT-1048 · 55 kW',units:1,order:2,loc:'Warehouse 1'},{id:'RT-1062',label:'RT-1062 · 55 kW',units:1,order:1,loc:'Warehouse 2'}],
    dests:[{id:'Site 3',label:'Site 3 · need in 10 days · 24/7 duty',cap:1},{id:'Site 5',label:'Site 5 · need in 24 days · light duty',cap:1},{id:'Resale',label:'External resale',cap:99}],

  addCase(c);
})();
/* ---- RT-1062 · pool partner for RT-1048 ---- */
(function(){
  const c=baseCase({id:'RT-1062',assetId:'MTR-2057',cls:'motor',owner:'Customer A',grade:'B',condition:'Grade B',assessment:'Ready',readiness:'ready',age:5.1,received:new Date('2026-09-30'),location:'Warehouse 2',
    spec:{'Rated power':'55 kW','IEC frame':'250M','Efficiency class':'IE3','Voltage':'400 V','Speed':'1,480 rpm'},mfr:'Voltara',engLife:'41 months',nextInspection:'May 2027',

  const rd=mkRoute({id:'redeploy',plan:'Redeploy RT-1062',demandLabel:'Site 5 · confirmed internal need',terms:[T('Avoided equivalent purchase',11200,'purchase'),T('Preparation and transfer',-1500,'prep'),T('Service exposure (30 months)',-800,'service'),T('Residual value adjustment',-300,'residual')],unc:'Cost and service forecasts',why:'Allocated to Site 5 so RT-1048 can serve Site 3',sigma:.1,target:'Site 5'});
  const sb=mkRoute({id:'resale',plan:'Sell whole asset',demandLabel:'Dealer network',demandStatus:'forecast',terms:[T('Expected sale proceeds',5100,'sale'),T('Fees and freight',-800,'fees')],unc:'Price, timing, unsold risk',why:'',sigma:.16});

function route(keep){
  if(!S.acct){renderSignIn();return}
  const r=parse();if(!PAGES[r.page]){rbBounce('Page not found. Showing your home page.');return}
  const ok=canRoute(r);if(ok!==true){rbBounce(ok==='tenant'?'That record belongs to a tenant you cannot see. Use the tenant menu to request access.':'Not available for the '+S.acct.role+' view.');return}
  const y=keep?scrollY:0;
  if(r.page==='integration'&&INT_TABS.includes(r.a))S.intTab=r.a;
  if(r.page==='integration'&&!canPage('integration',S.intTab))S.intTab=RB_SECS.integration.find(x=>canPage('integration',x));
  if(r.page==='mcp')S.mcpDir=r.a==='client'?'client':'server';
  const L=S.lastR;S.lastR=r;
  if(!keep&&ANCH[r.page]&&L&&L.page===r.page&&!(r.page==='mcp'&&(r.a==='client')!==(L.a==='client'))){navSync(r);anchorScroll(r);return}
  navSync(r);
  if((r.page==='product'?r.a:null)!==S.lastCase){S.lastCase=r.page==='product'?r.a:null;S.scenOpen=false;S.scen={purchase:1,cost:1,service:1,market:1,demandOff:false};S.xtab='why'}
  const isCase=r.page==='product'&&r.a&&/^RT-/.test(r.a)&&CASE_BY_ID[r.a];
  const j=r.page==='product'&&isCase?[2,3,4,5,6]:r.page==='command'&&!canPage('product')?[1,6,7,8,9]:PAGES[r.page].j;
  $('#jmount').innerHTML=journey(j);
  const nc=$('#navcnt');if(nc)nc.textContent=visCases().filter(c=>c.stage==='awaiting_approval').length;
  const v=$('#view');
  try{v.innerHTML=({command:renderCommand,product:renderProduct,analytics:renderAnalytics,integration:renderIntegration,mcp:renderMcp,audit:renderAudit,access:renderAccess})[r.page](r)}catch(err){console.error(err);v.innerHTML=`<div class="empty"><b>This view could not be drawn</b>${esc(err.message)}. Reload the page; your data is synthetic and regenerates identically.</div>`}
  document.title=PAGES[r.page].t+' · Circularity Decision Workbench';
  if(!keep){window.scrollTo(0,0)}else window.scrollTo(0,y);
  rbPrune();
  if(typeof afterRender==='function')afterRender(r,keep);
}

function renderProduct(r){

   <details class="dd" open><summary>Details</summary><dl class="kv">${Object.entries(c.spec).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}<dt>Manufacturer</dt><dd>${esc(c.mfr)} (fictional)</dd><dt>Age</dt><dd>${c.age} years</dd></dl></details>

ACT.expDetail=a=>{const e=EXPECTED.find(x=>x.id===a);openDrawer(`<div class="callout">Conditional plan. Expected ${e.date} Oct from <b>${esc(e.signal)}</b>. Nothing is reserved or promised until receipt and inspection establish actual availability.</div><dl class="kv" style="margin-top:14px"><dt>Owner</dt><dd>${e.owner}</dd><dt>Planning range</dt><dd>${e.range} (class prior, not decision-grade)</dd><dt>Receiving at</dt><dd>${e.loc}</dd></dl>`,`${e.id} · ${e.product}`,'Expected return')};
function evRow(e,c){c=c&&c.id?c:null;const ic={ready:'✓',missing:'!',partial:'~',stale:'~',conflict:'!'}[e.state];return `<div class="ev ${e.state}"><span class="ic" aria-hidden="true">${ic}</span><div><b>${esc(e.label)}${e.state!=='ready'?` <span class="chip ${e.state==='missing'||e.state==='conflict'?'bad':'warn'}">${e.state}</span>`:''}</b><small>${esc(e.source)}${e.note?' · '+esc(e.note):''}</small></div><em>${e.state==='missing'?'—':esc(e.fresh)}${c&&c.id?(e.state==='missing'?'<div style="margin-top:2px">'+PU+'</div>':`<div><button class="btn sm ghost" style="height:22px;padding:0 4px;font-size:11.5px" data-act="trace" data-arg="${c.id}|${e.k}">View Data Trace</button></div>`):''}</em></div>`}
/* ===== scenario maths ===== */
const KIND_MULT={purchase:'purchase',prep:'cost',fees:'cost',service:'service',sale:'market',parts:'market',material:'market',lease:'market'};
function scenNet(r){const sc=S.scen;return Math.round(sum(r.terms.map(t=>t.amt*(sc[KIND_MULT[t.kind]]||1))))}
function scenActive(){const s=S.scen;return s.purchase!==1||s.cost!==1||s.service!==1||s.market!==1||s.demandOff}
function scenRoutes(c){
  const rs=c.routes.map(r=>{const ex=r.excluded||(S.scen.demandOff&&r.demandStatus==='confirmed'&&(r.id==='redeploy'||r.id==='intparts')&&c.id!=='RT-1052');return{r,ex,sn:scenActive()?scenNet(r):r.net}});
  const el=rs.filter(x=>!x.ex).sort((a,b)=>b.sn-a.sn);el.forEach((x,i)=>x.rank=i+1);return{all:rs,el};
}
function flips(c){
  const el=c.routes.filter(r=>!r.excluded).sort((a,b)=>b.net-a.net);if(el.length<2||!c.recommendation)return[];
  const a=el[0],b=el[1],d=a.net-b.net,out=[];
  a.terms.forEach(t=>{if(!KIND_MULT[t.kind]||!t.amt)return;
    if(t.amt>0){const th=t.amt-d;out.push({txt:`${t.label} falls below ${money(th)}`,pct:-d/t.amt,to:b.plan})}
    else{const th=-t.amt+d;out.push({txt:`${t.label} rises above ${money(th)}`,pct:d/-t.amt,to:b.plan})}});
  b.terms.forEach(t=>{if(t.amt>0&&KIND_MULT[t.kind])out.push({txt:`${esc(b.plan)}: ${t.label.toLowerCase()} rises above ${money(t.amt+d)}`,pct:d/t.amt,to:b.plan})});
  if(a.demandStatus==='confirmed'&&a.id!=='exit')out.push({txt:`Confirmed demand (${a.demandLabel.split(' · ')[0]}) is cancelled`,pct:null,to:b.plan});
  return out.sort((x,y)=>(x.pct==null?-1:Math.abs(x.pct))-(y.pct==null?-1:Math.abs(y.pct))).slice(0,4);
}

   <div class="row note" style="margin-top:10px;gap:18px">${(c.facts||[]).map(f=>`<span>${esc(f)}</span>`).join('')}<span class="grow"></span><button class="btn sm" data-act="sources" data-arg="${c.id}">Inspect source records</button><button class="btn sm" data-act="models">Model versions &amp; validation</button></div></section>`;

   <div class="panel flat tw"><table class="t tight"><thead><tr><th>Rank / plan</th><th>Demand matched</th><th>Expected net contribution</th><th>Uncertainty and rationale</th><th>Gates</th></tr></thead><tbody>${rows}</tbody></table></div>

function specialBlock(c){

   <div><b>Risk-adjusted view</b><table class="terms" style="margin-top:6px">${top.terms.map(t=>`<tr><td>${esc(t.label)}</td><td class="${t.amt<0?'neg':''}">${money(t.amt)}</td></tr>`).join('')}<tr class="tot"><td>Risk-adjusted hold value</td><td>${money(top.net)}</td></tr><tr><td>Sell now</td><td>${money(h.sellNow)}</td></tr><tr><td><b>Advantage of holding</b></td><td class="pos"><b>${money(top.net-h.sellNow)}</b></td></tr></table></div></div>
   <dl class="kv" style="margin-top:12px"><dt>Named opportunity</dt><dd>${esc(h.opp)}</dd><dt>Review date</dt><dd>${h.review} (${h.days} days)</dd><dt>If demand fails</dt><dd>Sell near ${money(h.fallback)} (${money(h.fallback-h.sellNow)} vs today)</dd></dl></section>`}
  if(c.kind==='harvest'){const h=c.routes[0];out+=`<section class="blk"><div class="bh"><span class="bn">3b</span><h2>Selective harvest: one teardown, five outputs</h2>${stp(4)}</div><div class="panel flat tw"><table class="t static"><thead><tr><th>Output</th><th>Destination</th><th>Reference</th><th class="r">Value</th></tr></thead><tbody>${h.components.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.dest)}</td><td class="num">${x.ref}</td><td class="r num">${money(x.v)}</td></tr>`).join('')}<tr><td colspan="3"><b>Shared teardown</b> <span class="chip ok">charged once</span></td><td class="r num neg">−$240</td></tr><tr><td colspan="3">Logistics</td><td class="r num neg">−$90</td></tr><tr><td colspan="3"><b>Net contribution</b></td><td class="r num"><b>${money(h.net)}</b></td></tr></tbody></table></div><div class="note" style="margin-top:6px">Each component is allocated to exactly one destination. The remainder goes to material recovery; disposal avoidance is counted once.</div></section>`}
  if(c.kind==='exit'){const A=c.routes[0],B=c.routes[1],U=c.routes[2];out+=`<section class="blk"><div class="bh"><span class="bn">3b</span><h2>Responsible exit: approved vendors only</h2>${stp(4)}</div><div class="grid g3">${[A,B,U].map(v=>`<div class="panel flat" style="padding:12px;${v.excluded?'border-color:var(--bad)':''}"><b>${esc(v.vendor)}</b><div class="num" style="font:800 24px var(--f-display);margin:4px 0">${money(v.net)}</div><div class="note">${esc(v.demandLabel.split(' · ')[1]||'')}</div>${v.excluded?`<span class="chip bad" style="margin-top:6px">Ineligible: not certified</span>`:v===A?`<span class="chip ok" style="margin-top:6px">Saves ${money(B.net-A.net)} vs B</span>`:''}</div>`).join('')}</div></section>`}

function startSync(s,auto){
  if(!s||s.syncing)return;
  if(s.status==='unavailable'){if(!auto)toast(s.name+' is not connected. Open it and complete the connection first.');return}
  if(s.status==='manual'){if(!auto)toast(s.name+' is a manual import. Use the Manual import tab to load a file.');return}
  s.syncing=true;s.syncPct=0;smPatch(s);sdSyncUI(s);
  const t0=Date.now(),dur=1500+Math.random()*1700;
  const tick=()=>{if(!SRC(s.id)||!s.syncing)return;s.syncPct=Math.min(99,Math.round((Date.now()-t0)/dur*100));
    const t=$(`.tile[data-sid="${s.id}"]`);if(t){const i=t.querySelector('[data-sp]'),a=t.querySelector('[data-age]');i&&(i.style.width=s.syncPct+'%');a&&(a.textContent='Syncing… '+s.syncPct+'%')}
    if(Date.now()-t0<dur)setTimeout(tick,150);else fin()};
  const fin=()=>{if(!SRC(s.id))return;s.syncing=false;const now=Date.now();
    if(s.status==='stale'){s.runs.unshift({id:'SYNC-'+hashId(s.id+now).slice(0,5).toUpperCase(),ts:now,trigger:auto?'Scheduled':'Manual',rows:0,dur:Math.round(dur/100)/10,result:'failed',note:'HTTP 401 · feed token expired'});s.runs.length=Math.min(s.runs.length,12);
      hhBump('failed');smLogAdd(s,'Sync failed: feed token expired (HTTP 401). Last fresh data still in use.','bad');srcEvent(s,'sync.failed','failed','Sync rejected: token expired. Rotate credentials or refresh the token.');if(!auto)toast(s.name+': sync failed, the feed token has expired. Refresh the token to resume.',4200);smPatch(s);sdSyncUI(s);return}
    const n=rr(24,420);s.records+=n;s.lastSync=now;s.freshMin=0;s.fresh='just now';
    if(!s.compl){s.compl=rr(86,96);s.conf=rr(84,94);s.c0=s.compl;s.k0=s.conf}else{s.compl=clampN(s.c0+rr(-1,1),60,100);s.conf=clampN(s.k0+rr(-1,1),40,100)}
    s.runs.unshift({id:'SYNC-'+hashId(s.id+now).slice(0,5).toUpperCase(),ts:now,trigger:auto?'Scheduled':'Manual',rows:n,dur:Math.round(dur/100)/10,result:'success',note:''});s.runs.length=Math.min(s.runs.length,12);
    hhBump('success');smLogAdd(s,'Sync completed · '+fmtN(n)+' new or changed records');srcEvent(s,'sync.completed','acknowledged',fmtN(n)+' records pulled from '+s.vendor+' in '+(Math.round(dur/100)/10)+' s');
    if(!auto)toast(s.name+' synced: '+fmtN(n)+' records updated.');smPatch(s);sdSyncUI(s)};
  setTimeout(tick,160)}

 const nm=n.name.trim()||(n.type==='ingest'?'Ingest · '+s.vendor:n.type==='out'?'Outbound · '+s.vendor:n.type==='dec'?'Decision workflow':'New pipeline');

 const w=Object.assign({id:'WF-'+k,name:nm,status:'draft',ver:'0.1',graph:null,saved:null,dirty:false,running:false,updated:Date.now(),runsN:0,okN:0,last:null},base);S.wf.list.push(w);closeModal();toast(nm+' created as a draft. Arrange it, then Save and Publish.');ACT.wfOpen(w.id)};
const WF={t:null,drag:null,link:null,pal:null};
const wfClamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function wfInfo(n){
 if(n.k==='fixed'){const f=FXD[n.ref];return{label:f.label,sub:f.sub,tag:f.canon?'Fixed · canonical model':'Fixed · platform',in:f.in,out:f.out,desc:f.desc}}
 if(n.k==='conn'||n.k==='wconn'){const s=srcOr(n.ref),w=n.k==='wconn';return{label:s.deleted?'Deleted source':srcLabel(s),sub:s.deleted?'Reconnect or remove this step':w?(s.write[0]||'No write operations'):s.vendor+' · '+s.mode,tag:w?'Connector · write':'Connector · read',in:w,out:true,desc:w?'Sends approved instructions to the system that owns the work, and reports its acknowledgement back.':'Reads evidence from the system that owns it. The source system keeps owning its transactions.'}}
 if(n.k==='act'){const a=ACT_TYPES.find(t=>t.id===n.ref);return{label:a.label,sub:a.sub,tag:'Delivery method',in:true,out:true,desc:a.desc}}
 if(n.k==='xf'){const x=XF.find(t=>t.id===n.ref);return{label:x.label,sub:x.sub,tag:x.group==='ingest'?'Integration layer':x.group==='file'?'File exchange':'Transform',in:true,out:true,desc:x.desc}}
 if(n.k==='map'){const m=(MAPPINGS[n.ref]||[]).length;return{label:SH[n.ref]+' fields',sub:'→ '+MAP_TARGET[n.ref]+' · '+m+' mapped',tag:'Field mapping',in:true,out:true,desc:'Maps '+SH[n.ref]+' field names and values into the '+MAP_TARGET[n.ref]+' canonical model.'}}
 const t=TOOLS.find(x=>x.id===n.ref);return{label:t.id,sub:t.rw==='write'?'Write · '+t.approval:'Read · no approval needed',tag:'Agent tool',in:true,out:true,desc:t.desc}
}
/* ---- analysis and checks ---- */
function wfAnalyze(g){const by={},succ={},pred={};g.nodes.forEach(n=>{by[n.id]=n;succ[n.id]=[];pred[n.id]=[]});g.edges.forEach(e=>{if(by[e.a]&&by[e.b]){succ[e.a].push(e.b);pred[e.b].push(e.a)}});
 const reach=(id,adj)=>{const seen=new Set(),st=[id];while(st.length){const x=st.pop();adj[x].forEach(y=>{if(!seen.has(y)){seen.add(y);st.push(y)}})}return seen};
 return{by,succ,pred,anc:id=>reach(id,pred),desc:id=>reach(id,succ)}}
function wfValidate(g,kind0){
 const A=wfAnalyze(g),out=[],add=(sev,id,msg)=>out.push({sev,id,msg}),kind=kind0||S.wf.kind;
 g.nodes.forEach(n=>{
  const lb=wfInfo(n).label,np=A.pred[n.id].length,ns=A.succ[n.id].length;
  if((n.k==='conn'||n.k==='wconn'||n.k==='map')&&!SRC(n.ref)){add('error',n.id,(SH[n.ref]||'This source')+' was deleted from the Source map. Reconnect it or remove this step.');return}
  if(n.k==='conn'){const s=srcOr(n.ref);
   if(s.status==='unavailable')add('error',n.id,`${s.name} has no connected feed. Circularity will not infer data, so this evidence would be missing.`);
   else if(s.status==='stale')add('warn',n.id,`${s.name} is ${s.fresh} old. Predictions fall back to the last fresh data and say so.`);
   else if(s.status==='manual')add('info',n.id,`${s.name} is a manual import. It supports evaluation, not live automation.`);
   const st=[[n.id,false,false,false]],vis=new Set(),bad=new Set();let hit=false,noIng=false,noVal=false;
   while(st.length){const [x,vm,vi,vv]=st.pop(),key=x+'|'+vm+vi+vv;if(vis.has(key))continue;vis.add(key);A.succ[x].forEach(y=>{const m=A.by[y],v2=vm||m.k==='map',i2=vi||!!(m.k==='xf'&&XF.find(t=>t.id===m.ref).ingest),w2=vv||(m.k==='xf'&&m.ref==='x_val');if(m.k==='fixed'){hit=true;if(!v2&&FXD[m.ref].canon)bad.add(wfInfo(m).label);if(v2){if(!i2)noIng=true;if(!w2)noVal=true}}else st.push([y,v2,i2,w2])})}
   if(bad.size)add('error',n.id,`${s.name} reaches ${[...bad].join(', ')} without a field mapping. Raw vendor values would enter the canonical model.`);
   else if(!hit)add('warn',n.id,ns?`${s.name} does not reach a canonical model.`:`${s.name} is not wired into the workflow.`);
   else if(noIng||noVal)add('warn',n.id,`${s.name} reaches the models without ${[noIng?'an ingestion channel':'',noVal?'validation and enrichment':''].filter(Boolean).join(' or ')}. Access, ordering and bad rows are then not handled in one place.`)}
  if(n.k==='map'){const anc=[...A.anc(n.id)].map(i=>A.by[i]).filter(m=>m.k==='conn'),canon=[...A.desc(n.id)].map(i=>A.by[i]).filter(m=>m.k==='fixed'&&FXD[m.ref].canon).map(m=>FXD[m.ref].model);
   if(!np)add('warn',n.id,`${lb} is not fed by a connector.`);
   else if(!anc.length)add('error',n.id,`${lb} has no connector upstream, so there is nothing to map.`);
   else if(!anc.some(c=>c.ref===n.ref))add('error',n.id,`${lb} is fed by ${anc.map(c=>SH[c.ref]).join(', ')}. Field names would not line up.`);
   if(!(MAPPINGS[n.ref]||[]).length)add('error',n.id,`No field mapping is defined for ${SH[n.ref]} yet.`);
   if(!ns)add('warn',n.id,`${lb} does not lead to a canonical model.`);
   else if(canon.length&&!canon.includes(MAP_TARGET[n.ref]))add('error',n.id,`${lb} maps to ${MAP_TARGET[n.ref]}, but it is wired to ${canon.join(', ')}.`)}
  if(n.k==='xf'){const x=XF.find(t=>t.id===n.ref),anc=A.anc(n.id),conns=[...anc].map(i=>A.by[i]).filter(m=>m.k==='conn'),names=l=>[...new Set(l.map(c=>SH[c.ref]))].join(', ');
   if(!np||(!ns&&n.ref!=='x_notify'))add('warn',n.id,`${lb} is not wired between a source and a target.`);
   else{
    if(x.ingest){const bad=conns.filter(c=>{const q=srcOr(c.ref);return q.status!=='unavailable'&&!srcCh(q).includes(x.ingest)});if(bad.length)add('error',n.id,`${lb} receives ${names(bad)}, which does not arrive as ${CH_ARR[x.ingest]}.`)}
    if(x.fileIn&&conns.length&&!conns.some(c=>srcCh(srcOr(c.ref)).includes('file')))add('error',n.id,`${lb} needs a file to work on, but ${names(conns)} does not deliver files.`);
    if(n.ref==='x_man'&&![...anc].some(i=>A.by[i].k==='act'&&A.by[i].ref==='a_file'))add('error',n.id,'Create manifest follows File generation. The manifest lists the files the target will import.');
    if(n.ref==='x_cb'&&![...anc].some(i=>A.by[i].k==='wconn'))add('error',n.id,'Fetch import log runs after a target system has imported, so it follows a write connector.');
    if(n.ref==='x_notify'&&![...anc].some(i=>A.by[i].k==='xf'&&A.by[i].ref==='x_cb'))add('error',n.id,'The notification carries log links, so it follows Fetch import log.')}}
  if(n.k==='act'){const a=ACT_TYPES.find(t=>t.id===n.ref),anc=A.anc(n.id),dsc=[...A.desc(n.id)].map(i=>A.by[i]).filter(m=>m.k==='wconn');
   if(!np)add('warn',n.id,`${lb} is not wired to receive an instruction.`);
   else if(!anc.has('appr')||wfBypass(A,n.id,m=>m.id==='appr'))add('error',n.id,`${lb} bypasses Human approval. Anything that commits stock, spend or price always stops at a person.`);
   else if(![...anc].some(i=>A.by[i].k==='xf'&&A.by[i].ref==='x_env')||wfBypass(A,n.id,m=>m.k==='xf'&&m.ref==='x_env'))add('error',n.id,`${lb} needs an Instruction envelope upstream, so the receiving system can trace and de-duplicate it.`);
   if(np){if(!dsc.length)add('warn',n.id,`${lb} does not lead to a system that receives it.`);
    dsc.forEach(w=>{if(!(DELIVER[w.ref]||[]).includes(a.ch))add('error',n.id,`${SH[w.ref]} does not accept ${CH_DEL[a.ch]}. It accepts ${(DELIVER[w.ref]||[]).map(c=>CH_DEL[c]).join(', ')}.`)})}}
  if(n.k==='wconn'){const s=srcOr(n.ref),anc=A.anc(n.id);
   if(s.status==='unavailable')add('error',n.id,`${s.name} has no connected system to write to.`);
   else if(s.status==='stale')add('warn',n.id,`${s.name} has an expired token. Instructions would queue until it is refreshed.`);
   if(!np)add('warn',n.id,`${s.name} is not wired to receive an instruction.`);
   else if(!anc.has('appr')||wfBypass(A,n.id,m=>m.id==='appr'))add('error',n.id,`Writes to ${s.name} bypass Human approval. Anything that commits stock, spend or price always stops at a person.`);
   else if(![...anc].some(i=>A.by[i].k==='xf'&&A.by[i].ref==='x_env')||wfBypass(A,n.id,m=>m.k==='xf'&&m.ref==='x_env'))add('error',n.id,`Writes to ${s.name} need an Instruction envelope. Without the decision ID and approval reference, the receiving system cannot trace or de-duplicate it.`)}
  if(n.k==='tool'){const r=WF_TR[n.ref];

   return sep+`<tr tabindex="0" data-act="auEntry" data-arg="${x.id}"><td class="num nowrap">${x.ts.toISOString().slice(11,19)}</td><td>${esc(x.source)}</td><td><b>${x.caseId}</b><div class="note">${esc(x.item)}</div></td><td class="mono" style="max-width:260px;word-break:break-all">${esc(x.request)}</td><td>${esc(x.result)}</td><td style="max-width:240px">${esc(x.used)}</td><td>${stC(x.status)}${cmList('au:'+x.id).length?` <span class="chip line">${cmList('au:'+x.id).length} comment${cmList('au:'+x.id).length>1?'s':''}</span>`:''}</td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty"><b>No entries match</b>Clear the filters to see the whole log.</div></td></tr>'}</tbody></table></div>
  <div class="filters" style="border-top:1px solid var(--line2);border-bottom:0;justify-content:space-between"><span class="note">Showing ${shown.length} of ${all.length}. Entries are read-only; retraining never rewrites them.</span>${all.length>shown.length?`<button class="btn sm" data-act="auMore">Show 40 more</button>`:''}</div></div>
  <div class="sect"><div class="sh"><h2>Evidence gaps</h2><span class="note">No fetch is recorded for these, so no provenance is shown</span></div><div class="panel"><div class="tw"><table class="t static"><thead><tr><th>Case</th><th>Missing evidence</th><th>Expected source</th><th>Provenance</th></tr></thead><tbody>${gaps.slice(0,12).map(g=>`<tr style="cursor:pointer" data-act="trace" data-arg="${g.c.id}|${g.e.k}"><td><b>${g.c.id}</b></td><td>${esc(g.e.label)}</td><td>${esc(g.e.source)}</td><td>${PU}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">No gaps in this view.</div></td></tr>'}</tbody></table></div></div></div>`;
}
ACT.auQ=v=>{S.au.q=v;S.au.limit=40;route(true);const i=$('input[data-in=auQ]');i&&(i.focus(),i.setSelectionRange(v.length,v.length))};
ACT.auSrc=v=>{S.au.src=v;route(true)};ACT.auType=v=>{S.au.type=v;route(true)};ACT.auStatus=v=>{S.au.status=v;route(true)};ACT.auDir=()=>{S.au.dir*=-1;route(true)};ACT.auMore=()=>{S.au.limit+=40;route(true)};
ACT.auClear=()=>{S.au={q:'',src:'',type:'',status:'',dir:-1,limit:40};route(true)};
ACT.auCsv=()=>{const a=auditFiltered();buildCsv('timestamp_utc,source,case,item,request,result,used_in,provenance\n'+a.map(x=>[x.ts.toISOString(),x.source,x.caseId,x.item,x.request,x.result,x.used,x.status].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'audit-log.csv');toast('Exported '+a.length+' entries')};
ACT.auEntry=id=>{const x=auditEntries().find(e=>e.id===id);if(!x){toast('Entry not found');return}
  if(x.kind==='event'){const e=x.ev;openDrawerW(`<div class="row" style="margin-bottom:10px"><span class="chip ${e.dir==='out'?'dk':'line'}">${e.dir==='out'?'Outbound':'Inbound'}</span><span class="chip ${ackKind(e.ack)}">${esc(e.ack)}</span></div>${e.note?`<div class="callout" style="margin-bottom:12px">${esc(e.note)}</div>`:''}<table class="t static"><tbody>${[['Recorded at',isoT(e.ts)],['Recorded by',e.by],['Destination / source',e.dest],['Case',e.caseId],['Decision',e.decisionId],['Approval reference',e.approval],['Instruction version',e.ver],['Idempotency key',e.key]].map(r=>`<tr><td style="width:170px;color:var(--muted)">${r[0]}</td><td>${fv(r[1]&&r[1]!=='—'?r[1]:null)}</td></tr>`).join('')}</tbody></table><h4 style="margin:16px 0 6px">Raw event</h4><pre class="code">${jsonHtml({event:e.id,type:e.type,at:new Date(e.ts).toISOString(),caseId:e.caseId,decisionId:e.decisionId,approvalRef:e.approval,instructionVersion:e.ver,destination:e.dest,acknowledgement:e.ack,idempotencyKey:e.key})}</pre>${cmHTML('au:'+x.id,'audit entry')}`,e.type,e.id,e.caseId&&CASE_BY_ID[e.caseId]&&rbPath('product/'+e.caseId)?`<a class="btn" href="#/product/${e.caseId}" data-act="go" data-arg="product/${e.caseId}">Open ${e.caseId}</a>`:'');return}
  const p=x.p,c=CASE_BY_ID[x.caseId];
  openDrawerW(`<div class="row" style="margin-bottom:12px">${provChip(p)}<span class="chip line">${p.id}</span></div><h4 style="margin-bottom:6px">Provenance</h4>${provTable(p)}
  <h4 style="margin:18px 0 6px">Processing</h4><ol style="margin:0;padding-left:18px">${p.processing.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  <h4 style="margin:18px 0 6px">Where this data was used</h4><ul style="margin:0;padding-left:18px">${p.usedIn.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${cmHTML('au:'+x.id,'audit entry')}`,esc(x.item),`${x.caseId} · ${x.asset} · ${isoT(x.ts)}`,`<button class="btn pri" data-act="trace" data-arg="${x.caseId}|${x.key}">View Data Trace</button>${rbPath('product/'+x.caseId)?`<a class="btn" href="#/product/${x.caseId}" data-act="go" data-arg="product/${x.caseId}">Open ${x.caseId}</a>`:''}`)};

/* ===== boot ===== */
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click()}});
S.acct=sessionLoad();S.role=S.acct?S.acct.role:'';if(S.acct){shell();route()}else renderSignIn();

setInterval(()=>{try{smTick()}catch(e){console.error(e)}},1000);
</script>
</body>
</html>
